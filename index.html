let raise = false;
function calc() {
  const m = +$('m').value, y = +$('y').value, r = .08 / 12; let b = 0, c = m, paid = 0; const pts = [];
  for (let i = 0; i < y * 12; i++) { if (i && i % 12 === 0 && raise) c *= 1.1; b = b * (1 + r) + c; paid += c; if (i % 12 === 11) pts.push([b, paid]); }
  $('res').textContent = fmt(b); $('mv').textContent = fmt(m); $('yv').textContent = y;
  $('resSub').textContent = (L === 'ru' ? `через ${y} ${y === 1 ? T.ru.years1 : T.ru.yearsN}, к ${2026 + y} году` : `in ${y} ${y === 1 ? T.en.years1 : T.en.yearsN}, by ${2026 + y}`);
  $('paid').textContent = fmt(paid); $('gr').textContent = fmt(b - paid);
  const max = pts[pts.length - 1][0];
  $('chart').innerHTML = pts.map(([v, p]) => `<i class="${p / v > .999 ? '' : 'c'}" style="height:${Math.max(2, v / max * 100)}%;opacity:${.35 + .65 * v / max}"></i>`).join('');
}
function render() {
  document.documentElement.lang = L; const t = T[L];
  document.querySelectorAll('[data-t]').forEach(e => e.textContent = t[e.dataset.t]);
  $('lang').textContent = t.switch; $('heroimg').src = `img/home_${L}.jpg`;
  $('pf').innerHTML = PF[L].map(([p, n, d]) => `<div class="pf"><div class="pc">${p}%</div><div><div class="nm">${n}</div><div class="ds">${d}</div><div class="bar" style="width:${p * 3.2}%"></div></div></div>`).join('');
  $('rules').innerHTML = RULES[L].map(([h, li, btns]) => `<details class="acc"><summary>${h}</summary><div class="body"><ul>${li.map(x => `<li>${x}</li>`).join('')}</ul><div class="grid" style="margin-top:12px">${btns.map(([b, k]) => `<div class="tile" data-go="${k}"><b>${b}</b></div>`).join('')}</div></div></details>`).join('');
  $('toolsList').innerHTML = TOOLS[L].map(([g, items]) => `<div class="gh">${g}</div><div class="grid">${items.map(([n, d, k]) => `<div class="tile" data-go="${k}"><b>${n}</b><span>${d}</span></div>`).join('')}</div>`).join('');
  $('svc').innerHTML = SVC[L].map(([i, n, d]) => `<div class="svc"><div class="ic">${i}</div><div><b>${n}</b><p>${d}</p></div></div>`).join('');
  $('acc').innerHTML = ACC[L].map(([k, n, p, d, tag]) => `<div class="card">${tag ? `<div class="tag">${tag}</div>` : ''}<div class="price"><b>${n}</b><span>${p}</span></div><p class="note" style="margin:0 0 14px;color:#a8a8a8;font-size:13.5px">${d}</p><button class="btn ${k === 'map' ? 'w' : 'g'}" data-go="${k}">${k === 'map' ? t.buy : t.join}</button></div>`).join('');
  calc();
}
document.addEventListener('click', e => { const g = e.target.closest('[data-go]'); if (g) { tg?.HapticFeedback?.impactOccurred('light'); go(g.dataset.go); } });
$('lang').onclick = () => { L = L === 'en' ? 'ru' : 'en'; try { localStorage.setItem('cs_lang', L); } catch (e) {} render(); };
$('sw').onclick = () => { raise = !raise; $('sw').classList.toggle('on', raise); calc(); };
$('m').oninput = calc; $('y').oninput = calc;
const secs = ['plan', 'tools', 'services', 'access'];
addEventListener('scroll', () => { let cur = 'plan'; secs.forEach(s => { if ($(s).getBoundingClientRect().top < 140) cur = s; }); document.querySelectorAll('.nav a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + cur)); }, { passive: true });
render();
</script>
</body>
</html>
